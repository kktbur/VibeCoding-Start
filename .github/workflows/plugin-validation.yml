name: Plugin Validation

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate Plugin and Skill contracts
        run: python tests/validate_plugin.py plugins/vibecoding-start --marketplace .agents/plugins/marketplace.json
      - name: Run project-knowledge fixtures
        run: python tests/test_project_knowledge.py
      - name: Validate public examples
        run: python tests/test_public_examples.py
      - name: Validate README language navigation
        run: python tests/test_readme_navigation.py
      - name: Validate public governance documents
        run: python tests/test_governance_docs.py
      - name: Validate small-project gate depth
        run: python tests/test_small_path_contract.py
      - name: Check active name consistency
        run: python tests/check_name_drift.py .
      - name: Check Plugin version against CHANGELOG
        run: python tests/check_version_consistency.py
      - name: Check tracked text line endings
        run: python tests/check_line_endings.py .
      - name: Compile Skill helper scripts
        run: python -m compileall -q plugins/vibecoding-start/skills
      - name: Run Unix check wrapper
        run: bash scripts/check.sh

