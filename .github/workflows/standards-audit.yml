name: Standards Audit

on:
  push:
  pull_request:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Audit required project documents
        run: python plugins/vibecoding-start/skills/vibecoding-project-knowledge/scripts/audit_docs.py .
      - name: Check curated Markdown links
        run: python plugins/vibecoding-start/skills/vibecoding-project-knowledge/scripts/check_links.py .
      - name: Check current-state freshness
        run: python plugins/vibecoding-start/skills/vibecoding-project-knowledge/scripts/detect_stale_docs.py . --max-age-days 30
